name: Production Order Cleanup Scheduler

on:
  schedule:
    # Trigger every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual cleanup dispatch"
        required: false
        default: "Manual operator trigger"

# Prevent overlapping cleanup executions
concurrency:
  group: cron-order-cleanup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    name: Invoke Production Order Cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Order Expiration Cleanup
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail

          TIMESTAMP="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          ENDPOINT="https://vibelock.bd/api/cron/orders/cleanup"

          echo "=========================================================="
          echo "VibeLock Production Order Expiration Cleanup"
          echo "Run ID:    ${GITHUB_RUN_ID}"
          echo "Timestamp: ${TIMESTAMP}"
          echo "Target:    ${ENDPOINT}"
          echo "=========================================================="

          # Verify secret presence without echoing value
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Required secret 'CRON_SECRET' is not configured or is empty in GitHub Actions secrets."
            exit 1
          fi

          # Dispatch POST request with connection timeout (10s), max total time (30s),
          # up to 3 retries on transient connection/gateway errors with 5s delay.
          # Output is saved to a temporary file; sensitive headers and body are never echoed.
          CURL_EXIT=0
          HTTP_STATUS=$(curl -s -S -o /tmp/cleanup_response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "Content-Type: application/json" \
            --connect-timeout 10 \
            --max-time 30 \
            --retry 3 \
            --retry-delay 5 \
            --retry-connrefused \
            "${ENDPOINT}") || CURL_EXIT=$?

          if [ "${CURL_EXIT}" -ne 0 ]; then
            echo "::error::Network or transport failure contacting order cleanup endpoint (curl exit code: ${CURL_EXIT})."
            rm -f /tmp/cleanup_response.json
            exit 1
          fi

          echo "HTTP Response Status: ${HTTP_STATUS}"

          # Verify 2xx success status
          if [[ "${HTTP_STATUS}" =~ ^2[0-9]{2}$ ]]; then
            # Parse safe numeric metrics if jq is available; do not print raw response (PII/order ID safe)
            if command -v jq >/dev/null 2>&1 && [ -f /tmp/cleanup_response.json ]; then
              SCANNED=$(jq -r '.result.scanned // "N/A"' /tmp/cleanup_response.json 2>/dev/null || echo "N/A")
              EXPIRED=$(jq -r '.result.expired // "N/A"' /tmp/cleanup_response.json 2>/dev/null || echo "N/A")
              SKIPPED=$(jq -r '.result.skipped // "N/A"' /tmp/cleanup_response.json 2>/dev/null || echo "N/A")
              echo "Cleanup Metrics: scanned=${SCANNED}, expired=${EXPIRED}, skipped=${SKIPPED}"
            fi
            echo "Order expiration cleanup completed successfully."
            rm -f /tmp/cleanup_response.json
            exit 0
          else
            echo "::error::Order cleanup endpoint responded with non-2xx status code (${HTTP_STATUS})."
            rm -f /tmp/cleanup_response.json
            exit 1
          fi
