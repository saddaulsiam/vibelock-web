name: Production Database Migration

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types:
      - completed
  workflow_dispatch: # Allow manual trigger

concurrency:
  group: production-migration
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    name: Run Prisma Migrate Deploy
    runs-on: ubuntu-latest
    environment: production
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Verify CI Status for Manual Dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$TARGET_REF" != "refs/heads/main" ]; then
            echo "::error::Production deployment is restricted to the 'main' branch (attempted from $TARGET_REF)."
            exit 1
          fi

          echo "Verifying CI status for commit $TARGET_SHA on branch $REF_NAME in $REPO..."
          RUN_INFO=$(gh run list --repo "$REPO" --workflow=ci.yml --branch=main --event=push --commit="$TARGET_SHA" --json databaseId,status,conclusion,event,headBranch --jq 'if length > 0 then (.[0] | "\(.status // "none") \(.conclusion // "none") \(.event // "none") \(.headBranch // "none")") else empty end')

          if [ -z "$RUN_INFO" ] || [ "$RUN_INFO" = "null" ]; then
            echo "::error::No completed push-event CI run found on branch 'main' for commit $TARGET_SHA. Automated CI must pass on main before deploying to production."
            exit 1
          fi

          read -r STATUS CONCLUSION RUN_EVENT RUN_BRANCH <<< "$RUN_INFO"

          echo "CI Run Status: $STATUS, Conclusion: $CONCLUSION, Event: $RUN_EVENT, Branch: $RUN_BRANCH"

          if [ "$STATUS" != "completed" ] || [ "$CONCLUSION" != "success" ] || [ "$RUN_EVENT" != "push" ] || [ "$RUN_BRANCH" != "main" ]; then
            echo "::error::Cannot deploy commit $TARGET_SHA to Production: matching CI run has status='$STATUS', conclusion='$CONCLUSION', event='$RUN_EVENT', branch='$RUN_BRANCH'. A completed successful push-event CI run on branch 'main' is required."
            exit 1
          fi

          echo "Pre-flight CI check passed successfully for commit $TARGET_SHA."

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Prisma Migration
        run: npm run db:migrate:deploy
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
